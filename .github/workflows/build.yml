name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "assets/screenshots/**"]
  workflow_dispatch:
    inputs:
      ios_signed:
        description: "iOS: sign the build (else compile check only)"
        type: boolean
        default: false
      ios_upload:
        description: "iOS: upload the signed build to App Store Connect (needs the app record)"
        type: boolean
        default: false
      screenshots:
        description: "Capture App Store screenshots on the 6.9-inch iPhone simulator"
        type: boolean
        default: false

# Per event: a push must not cancel a manual signing/upload run in flight.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      # No key.properties on CI -> debug-key signed. This only proves the
      # Gradle + CMake/Oboe build; store AABs are built locally with the upload key.
      - run: flutter build appbundle --release

  ios:
    runs-on: macos-latest
    env:
      TEAM_ID: HB85X53L9D
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Build number must be unique per App Store Connect upload.
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Archive + sign (App Store Connect API key, cloud-managed signing)
        if: ${{ inputs.ios_signed || inputs.ios_upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          DESTINATION: ${{ inputs.ios_upload && 'upload' || 'export' }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          set -o pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$TEAM_ID" \
            "${AUTH[@]}" archive | tail -40
          sed "s/__DESTINATION__/$DESTINATION/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}"
          if [ "$DESTINATION" = export ]; then
            # Apple's upload validation, synchronously. Rejections otherwise arrive only by
            # account e-mail and the build just never shows up in /v1/builds.
            mkdir -p ~/.appstoreconnect/private_keys && cp "$KEY" ~/.appstoreconnect/private_keys/
            xcrun altool --validate-app -f "$RUNNER_TEMP"/export/*.ipa -t ios               --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal || true
          fi
          rm -f "$KEY"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.ios_signed && !inputs.ios_upload }}
        with:
          name: echomic-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa

  screenshots:
    if: ${{ inputs.screenshots }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --simulator --debug
      - name: Boot 6.9-inch iPhone, capture home screen
        run: |
          set -e
          DEV=$(xcrun simctl list devices available | grep -E "iPhone 1[6-9] Pro Max" | tail -1 | grep -oE "[0-9A-F]{8}-[0-9A-F-]{27}")
          echo "device: $DEV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl status_bar "$DEV" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEV" build/ios/iphonesimulator/Runner.app
          mkdir -p shots
          # The app is always dark-themed, so one capture covers both appearances.
          xcrun simctl launch "$DEV" com.dailightstudio.echomic
          sleep 12
          xcrun simctl io "$DEV" screenshot shots/iphone69_home.png
          sips -g pixelWidth -g pixelHeight shots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
