name: echomic
description: "Low-latency karaoke microphone app (mic -> gain + echo -> speaker)."
publish_to: 'none'

version: 1.0.1+7

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.2.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/photos/header_mic.jpg
